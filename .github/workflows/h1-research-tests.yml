name: H1 research isolated tests
on:
  pull_request:
    paths:
      - 'research_h1_alerts/**'
      - '.github/workflows/h1-research-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - run: python -m unittest research_h1_alerts.test_monitor -v
