services:
  - type: web
    name: crypto-spread-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    envVars:
      - key: MIN_SPREAD_PCT
        value: "2.0"
      - key: TRADE_USDT
        value: "1000"
      - key: SCAN_INTERVAL_SEC
        value: "20"
      - key: MIN_TOP_BOOK_USDT
        value: "1000"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
